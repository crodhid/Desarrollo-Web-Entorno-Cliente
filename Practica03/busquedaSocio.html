<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ficha de socio · Club Deportivo</title>
    <link rel="stylesheet" href="stylesSocio.css">
    <script src="socio.js" defer></script>
</head>
<body class="pagina-ficha">

    <header class="cabecera">
        <h1>Club Deportivo</h1>
        <p class="cabecera-subtitulo">Ficha de socio</p>
    </header>

    <main class="contenedor-ficha">
        <section class="panel">

            <header class="ficha-cabecera">
                <span id="ficha-iniciales" class="iniciales iniciales-grande"></span>
                <div>
                    <h3 id="ficha-nombre"></h3>
                    <p id="ficha-id" class="ficha-id"></p>
                </div>
            </header>

            <dl class="ficha-datos">
                <div><dt>DNI</dt><dd id="ficha-dni-dato"></dd></div>
                <div><dt>Email</dt><dd id="ficha-email"></dd></div>
                <div><dt>Teléfono</dt><dd id="ficha-telefono"></dd></div>
                <div><dt>Nacimiento</dt><dd id="ficha-nacimiento"></dd></div>
                <div><dt>Alta</dt><dd id="ficha-alta"></dd></div>
                <div><dt>Actividades</dt><dd id="ficha-actividades"></dd></div>
                <div><dt>Cuota mensual</dt><dd id="ficha-cuota"></dd></div>
                <div><dt>Curiosidades</dt><dd id="ficha-curiosidades"></dd></div>
            </dl>

        </section>
    </main>

</body>
</html>
